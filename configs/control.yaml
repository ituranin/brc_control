# Parameters of the brc_control node. Values that are not listed keep the defaults from the code.
# Live tuning: ros2 run rqt_reconfigure rqt_reconfigure   (or: ros2 param set /brc_control <name> <value>)
# `ros2 param dump /brc_control` prints values only; copy them into the ros__parameters block below
# (do not overwrite this file with the dump, the node name wrapper and the list format would be lost).
brc_control:
  ros__parameters:
    lateral_controller: DynamicPurePursuit  # DynamicPurePursuit | PurePursuit (only read at startup)
    velocity: 3.0  # static velocity, used unless dynamic_velocity is true [m/s]

    wheelbase: 1.53
    look_ahead_distance: 3.0  # fallback if no curvature is available [m]
    look_ahead_rise_limit: 0.05  # max look-ahead increase per step [m]
    look_ahead_descent_limit: 1.0  # max look-ahead decrease per step [m]
    # Flat list of (abs curvature [1/m], look-ahead [m]) pairs
    look_ahead_lut: [0.1, 2.0, 0.01, 6.0, 0.001, 12.0]
    min_steering_angle: -0.75
    max_steering_angle: 0.75
    debug: false
    # Dynamic velocity (DynamicPurePursuit): target speed from the look-ahead distance
    dynamic_velocity: true  # true: use velocity_lut instead of `velocity`
    # Flat list of (look-ahead [m], velocity [m/s]) pairs
    velocity_lut: [2.0, 1.2, 2.1, 2.0, 3.0, 4.0, 5.0, 12.0, 12.0, 20.0]
    min_velocity: 1.0  # [m/s]
    max_velocity: 20.0  # [m/s]
    velocity_rise_limit: 0.01  # max velocity increase per step [m/s] (~1 m/s^2 at 30 Hz)
    velocity_descent_limit: 1.0  # max velocity decrease per step [m/s] (~3 m/s^2 at 30 Hz)
